# Painel pessoal: Laravel + FrankenPHP + SQLite, tudo em um contêiner.
# Porta publicada SOMENTE em loopback. Não monta o socket do Docker e não usa modo privilegiado.
name: painel-pessoal

services:
  painel:
    build:
      context: .
      target: runtime
      args:
        PUID: "1000"
        PGID: "1000"
    image: naibed-server:local
    container_name: naibed-server
    restart: unless-stopped
    user: "1000:1000"
    init: true

    ports:
      - "0.0.0.0:8080:8081"

    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/painel/database/database.sqlite

    volumes:
      # Dados persistentes fora da camada descartável do contêiner.
      - /var/lib/painel-pessoal/database:/var/lib/painel/database
      - /var/lib/painel-pessoal/storage:/app/storage
      - /var/lib/painel-pessoal/backups:/backups
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256

    # Limita e rotaciona o log do contêiner (acesso do Caddy e erros do PHP).
    # Isto NÃO limita cache, sessões, banco ou o disco inteiro.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8081/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
