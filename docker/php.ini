expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
upload_max_filesize = 1M
post_max_size = 2M
max_execution_time = 30
zend.assertions = -1
opcache.enable = 1
opcache.memory_consumption = 64
; Imagem imutável: os arquivos só mudam ao reconstruir.
opcache.validate_timestamps = 0
